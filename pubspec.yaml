name: _lexical_workspace
description: >-
  Development-only workspace root for the Dart/Flutter Lexical-compatible editor
  packages. Not published.
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/lexical_code
  - packages/lexical_collab
  - packages/lexical_conformance
  - packages/lexical_core
  - packages/lexical_editor_flutter
  - packages/lexical_flutter
  - packages/lexical_hashtag
  - packages/lexical_history
  - packages/lexical_html
  - packages/lexical_link
  - packages/lexical_list
  - packages/lexical_mark
  - packages/lexical_markdown
  - packages/lexical_mention
  - packages/lexical_mention_flutter
  - packages/lexical_rich_text
  - packages/lexical_table

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
