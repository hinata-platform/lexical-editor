name: Publish

# Releases every package to pub.dev from one tag.
#
# The packages version in lockstep — they are one library split for
# pay-for-what-you-use, not a set of independent projects — so one `v1.0.0` tag
# releases the set. pub.dev's automated publishing is configured per package
# with the tag pattern `v{{version}}`, which matches that tag for whichever
# package is being uploaded.
#
# Two things this cannot do for you, both one-time and both on pub.dev:
#
#  1. A package's "Automated publishing" settings live on its admin page,
#     which exists only after the package does. The first upload of each
#     package is therefore manual — see RELEASING.md.
#  2. Ownership by the ahmadre.com publisher is granted on pub.dev, not here.
#
# Once both are done, pushing a tag is the whole release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only, publish nothing'
        type: boolean
        default: true

permissions:
  id-token: write   # pub.dev authenticates this run by its OIDC token
  contents: read

jobs:
  publish:
    name: publish to pub.dev
    runs-on: ubuntu-latest
    # If "Require GitHub Actions environment" is ever enabled on pub.dev, add
    # `environment: pub.dev` here and create that environment in the repo.
    steps:
      - uses: actions/checkout@v4

      # `pub publish` authenticates as this workflow through the OIDC token
      # GitHub mints when `id-token: write` is granted. When that token is not
      # there, pub does not fail — it falls back to an interactive browser
      # login, prints a Google URL and waits for a click that a runner can
      # never produce. The job then sits at "Waiting for your authorization..."
      # until it times out, six hours later, and GitHub writes no log until it
      # ends, so the run looks busy and says nothing. Checking first turns that
      # into an immediate, explanatory failure.
      #
      # Runs on a manual dispatch as well as on a tag: this is the one step
      # worth being able to run without publishing anything.
      - name: OIDC token is actually available
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL is not set, so pub would fall"
            echo "back to an interactive login and hang. Check:"
            echo "  1. Settings -> Actions -> General -> Workflow permissions"
            echo "  2. pub.dev, per package: Admin -> Automated publishing,"
            echo "     repository hinata-platform/lexical-editor,"
            echo "     tag pattern v{{version}}"
            echo "::error::No OIDC token — pub would hang on an interactive login. See the log for what to check."
            exit 1
          fi
          echo "OIDC endpoint present — pub will authenticate as this workflow."

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Having the OIDC token is not the same as pub having it. `setup-dart`
      # performs this exchange as part of its own setup, which is why the
      # published recipe never mentions it — but these are Flutter packages,
      # `flutter-action` is the setup action, and it does not. Without this
      # step pub finds no credentials at all and falls back to the interactive
      # login, which is the hang the check above describes.
      - name: Hand the OIDC token to pub
        run: |
          PUB_TOKEN="$(curl --retry 5 --retry-connrefused -sSLf \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            -H "User-Agent: actions/oidc-client" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            | jq -r '.value')"
          if [ -z "$PUB_TOKEN" ] || [ "$PUB_TOKEN" = "null" ]; then
            echo "::error::The OIDC endpoint returned no token for audience https://pub.dev."
            exit 1
          fi
          # Never let it reach a log, including through a later failure.
          echo "::add-mask::$PUB_TOKEN"
          echo "PUB_TOKEN=$PUB_TOKEN" >> "$GITHUB_ENV"
          # Records *where* the token comes from, not the token itself, so it
          # is read from the environment at upload time.
          dart pub token add https://pub.dev --env-var PUB_TOKEN

      - name: Resolve workspace
        run: flutter pub get

      - name: Publish order still covers every package
        run: dart tool/check_publish_order.dart

      # A tag that disagrees with the pubspecs would publish versions nobody
      # asked for, and a publish cannot be undone. Refuse before uploading
      # anything rather than discovering it halfway through the set.
      - name: Tag and pubspec versions agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          echo "tag version: $tag"
          fail=0
          for pubspec in packages/*/pubspec.yaml; do
            grep -qE '^publish_to:[[:space:]]*none' "$pubspec" && continue
            version="$(grep -E '^version:' "$pubspec" | head -1 | cut -d' ' -f2)"
            if [ "$version" != "$tag" ]; then
              echo "::error file=$pubspec::$pubspec is $version, tag says $tag"
              fail=1
            fi
          done
          exit $fail

      # Everything is validated before anything is uploaded. Publishing is
      # irreversible, so a set that fails halfway is the outcome worth
      # engineering against.
      - name: Validate every package
        run: |
          set -euo pipefail
          for package in $(grep -v '^#' .github/publish-order.txt); do
            echo "== $package"
            (cd "packages/$package" && flutter pub publish --dry-run)
          done

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          set -euo pipefail
          version="$(grep -E '^version:' packages/lexical_core/pubspec.yaml \
            | head -1 | cut -d' ' -f2)"
          # In dependency order: lexical_flutter cannot resolve until
          # lexical_core is on pub.dev.
          for package in $(grep -v '^#' .github/publish-order.txt); do
            # Resumable, because a release can stop halfway through for
            # reasons that have nothing to do with this repository — pub.dev
            # rate-limits publishing per day, and nineteen packages is a
            # meaningful part of that budget. Re-running then has to continue
            # the set rather than fail on the first package that is already
            # up, since the alternative is publishing the rest by hand.
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              "https://pub.dev/api/packages/$package/versions/$version" \
              || echo 000)"
            if [ "$code" = "200" ]; then
              echo "== $package $version is already on pub.dev, skipping"
              continue
            fi
            echo "== publishing $package"
            (cd "packages/$package" && flutter pub publish --force)
          done
