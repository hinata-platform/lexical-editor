name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so an upstream Lexical release that changes the wire format
    # becomes a dated build failure rather than silent compatibility drift.
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve workspace
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # A new package that never reaches the release order is released never,
      # and nobody notices until someone asks where it is.
      - name: Publish order and versions
        run: dart tool/check_publish_order.dart

      - name: Test every package
        run: |
          set -e
          for dir in packages/*/; do
            if [ -d "$dir/test" ]; then
              echo "== $dir"
              if grep -q "sdk: flutter" "$dir/pubspec.yaml"; then
                (cd "$dir" && flutter test --reporter=expanded)
              else
                (cd "$dir" && dart test --reporter=expanded)
              fi
            fi
          done

  examples:
    name: every example still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # An example is the first thing anyone evaluating a package runs, so a
      # broken one is a broken first impression. Running them is cheap; the
      # console ones take a second each.
      - name: Console examples
        run: |
          set -e
          for dir in packages/*/; do
            [ -f "$dir/example/main.dart" ] || continue
            echo "== $dir"
            (cd "$dir" && dart run example/main.dart > /dev/null)
          done

      - name: App examples
        run: |
          set -e
          for dir in packages/*/example/; do
            [ -f "$dir/pubspec.yaml" ] || continue
            echo "== $dir"
            (cd "$dir" && flutter pub get && flutter analyze && flutter test)
          done

  discover:
    name: discover publishable packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      # Derived, not hand-maintained: a hard-coded list lets a new package
      # join the workspace and quietly skip its publish check, which is only
      # noticed at release time.
      - id: list
        run: |
          set -euo pipefail
          names=()
          for pubspec in packages/*/pubspec.yaml; do
            package="$(basename "$(dirname "$pubspec")")"
            if grep -qE '^publish_to:[[:space:]]*none[[:space:]]*$' "$pubspec"; then
              echo "skipping $package — publish_to: none"
              continue
            fi
            names+=("$package")
          done
          json="$(printf '%s\n' "${names[@]}" \
            | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "publishable: $json"
          echo "packages=$json" >> "$GITHUB_OUTPUT"

  publish-dry-run:
    name: pub publish --dry-run (${{ matrix.package }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - working-directory: packages/${{ matrix.package }}
        run: flutter pub publish --dry-run

  fixture-drift:
    name: fixtures still canonical for upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install upstream Lexical
        working-directory: tool/fixtures
        run: npm ci || npm install

      - name: Check fixtures are a fixed point
        working-directory: tool/fixtures
        run: node gen_fixtures.mjs --check ../../packages/lexical_core/test/fixtures
