name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so an upstream Lexical release that changes the wire format
    # becomes a dated build failure rather than silent compatibility drift.
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve workspace
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Test lexical_core
        working-directory: packages/lexical_core
        run: dart test --reporter=expanded

      - name: Test lexical_history
        working-directory: packages/lexical_history
        run: dart test --reporter=expanded

  publish-dry-run:
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [lexical_core, lexical_history]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - working-directory: packages/${{ matrix.package }}
        run: dart pub publish --dry-run

  fixture-drift:
    name: fixtures still canonical for upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install upstream Lexical
        working-directory: tool/fixtures
        run: npm ci || npm install

      - name: Check fixtures are a fixed point
        working-directory: tool/fixtures
        run: node gen_fixtures.mjs --check ../../packages/lexical_core/test/fixtures
