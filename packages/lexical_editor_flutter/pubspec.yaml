name: lexical_editor_flutter
description: >-
  Batteries-included Lexical editor for Flutter: every node type registered,
  a default theme with presenters for each of them, history, and one widget
  that puts it together.
version: 1.5.0
repository: https://github.com/hinata-platform/lexical-editor
issue_tracker: https://github.com/hinata-platform/lexical-editor/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  lexical_code: ^1.5.0
  lexical_core: ^1.5.0
  lexical_embed: ^1.5.0
  lexical_flutter: ^1.5.0
  lexical_hashtag: ^1.5.0
  lexical_history: ^1.5.0
  lexical_image: ^1.5.0
  lexical_link: ^1.5.0
  lexical_list: ^1.5.0
  lexical_mark: ^1.5.0
  lexical_mention: ^1.5.0
  lexical_mention_flutter: ^1.5.0
  lexical_rich_text: ^1.5.0
  lexical_table: ^1.5.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
