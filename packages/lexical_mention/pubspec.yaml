name: lexical_mention
description: >-
  Typed @mention nodes for lexical_core - users, issues, documents or any
  custom kind - with trigger matching and a debounced, cancelling search
  controller. Pure Dart.
version: 1.7.4
repository: https://github.com/hinata-platform/lexical-editor
issue_tracker: https://github.com/hinata-platform/lexical-editor/issues

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  lexical_core: ^1.7.0
  meta: ^1.15.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
