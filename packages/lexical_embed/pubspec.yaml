name: lexical_embed
description: >-
  YouTube, tweet and Figma embeds for lexical_core, matching the Lexical
  playground's wire format, with URL recognition and a Flutter card widget.
version: 1.1.0
repository: https://github.com/hinata-platform/lexical-editor
issue_tracker: https://github.com/hinata-platform/lexical-editor/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  lexical_core: ^1.1.0
  lexical_markdown: ^1.1.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
