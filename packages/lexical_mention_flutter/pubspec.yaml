name: lexical_mention_flutter
description: >-
  Typeahead UI for lexical_mention: a caret-anchored suggestion popover with
  debounced async search, keyboard navigation and atomic mention insertion.
version: 1.7.4
repository: https://github.com/hinata-platform/lexical-editor
issue_tracker: https://github.com/hinata-platform/lexical-editor/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  lexical_core: ^1.7.0
  lexical_flutter: ^1.7.0
  lexical_mention: ^1.7.0
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
