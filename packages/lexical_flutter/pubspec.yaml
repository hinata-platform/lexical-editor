name: lexical_flutter
description: >-
  Flutter rendering, selection and input layer for lexical_core: a dirty-set
  reconciler, one render object per block, InlineSpan building with a
  bidirectional offset map, theming and IME integration.
version: 0.1.0-dev.1
repository: https://github.com/hinata-platform/lexical-editor
issue_tracker: https://github.com/hinata-platform/lexical-editor/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  lexical_core: ^0.1.0-dev.2
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
